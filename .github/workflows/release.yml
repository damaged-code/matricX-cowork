name: Release (build + package portable artifacts)

# P2 item: attach ready-to-run Linux/Windows packages to a GitHub Release.
# Triggered by pushing a tag named v<something> (e.g. v0.5.0).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential cmake pkg-config ninja-build xvfb \
            qt6-base-dev qt6-svg-dev qt6-multimedia-dev \
            libx11-dev libxtst-dev libxfixes-dev libpng-dev
      - name: Build + package
        run: ./scripts/package-linux.sh
      - name: Validate tool schemas
        run: |
          tools/matricX-cowork/matricX-cowork --describe > /tmp/describe.json 2>/dev/null
          python3 -c "import json;d=json.load(open('/tmp/describe.json'));assert len([t['name'] for t in d])==17, 'expected 17 tools';print('tool schemas OK')"
      - name: Smoke test JSON-lines protocol
        run: xvfb-run -a ./scripts/smoke-test.sh
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows package
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
      - name: Build + package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Validate tool schemas
        shell: pwsh
        run: |
          $json = & .\tools\matricX-cowork\matricX-cowork.exe --describe | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Tool --describe failed" }
          $tools = @($json | ConvertFrom-Json)
          $names = @($tools | ForEach-Object { $_.name })
          if ($names.Count -ne 17) { throw "Expected 17 tools, got $($names.Count)" }
          if (($names | Select-Object -Unique).Count -ne $names.Count) { throw "Duplicate tool names found" }
          Write-Host "tool schemas OK"
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release and attach packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/package-linux/*.tar.gz
            artifacts/package-windows/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
