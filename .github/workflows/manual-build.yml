name: Manual build and smoke tests

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build
        type: choice
        required: true
        default: all
        options:
          - all
          - linux
          - windows
      run_smoke_tests:
        description: Run the Linux JSON-lines smoke test (requires Xvfb)
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: manual-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux build${{ github.ref_name }}
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential cmake pkg-config ninja-build xvfb \
            qt6-base-dev qt6-svg-dev qt6-multimedia-dev \
            libx11-dev libxtst-dev libxfixes-dev libpng-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build UI and Linux tool
        id: build
        run: cmake --build build --parallel 2
      - name: Smoke test JSON-lines protocol
        if: inputs.run_smoke_tests
        run: xvfb-run -a ./scripts/smoke-test.sh
      - name: Upload Linux executables
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: matricx-cowork-linux
          path: |
            build/m_cowork_ui
            tools/matricX-cowork/matricX-cowork
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows build
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
      - name: Build and deploy portable Windows package
        id: build
        shell: pwsh
        run: |
          & .\scripts\build.ps1 -Clean
          if ($LASTEXITCODE -ne 0) { throw "Windows build/deployment failed" }
      - name: Validate package and helper tool
        shell: pwsh
        run: |
          $json = & .\build\tools\matricX-cowork\matricX-cowork.exe --describe | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Packaged tool --describe failed" }
          $tools = @($json | ConvertFrom-Json)
          $names = @($tools | ForEach-Object { $_.name })
          if ($names.Count -eq 0) { throw "Tool schema list is empty" }
          if (($names | Select-Object -Unique).Count -ne $names.Count) { throw "Duplicate tool names found" }
          foreach ($expected in @("fs_list", "fs_read", "fs_write", "fs_mkdir", "fs_delete")) {
            if ($names -notcontains $expected) { throw "Missing filesystem tool: $expected" }
          }
          $zip = Join-Path $PWD "matricx-cowork-windows.zip"
          if (-not (Test-Path $zip)) { throw "Portable ZIP was not produced" }
          $temp = Join-Path $env:TEMP "matricx-cowork-package-test"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $temp
          foreach ($required in @("m_cowork_ui.exe","Qt6Core.dll","Qt6Gui.dll","Qt6Widgets.dll","Qt6Svg.dll","Qt6Network.dll","dll-dependencies.txt","platforms\qwindows.dll","tools\matricX-cowork\matricX-cowork.exe","assets")) {
            if (-not (Test-Path (Join-Path $temp $required))) { throw "ZIP missing $required" }
          }
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath (Join-Path $temp "m_cowork_ui.exe") -WorkingDirectory $temp -PassThru
          Start-Sleep -Seconds 5
          $proc.Refresh()
          if ($proc.HasExited) { throw "Packaged GUI exited during clean-PATH startup test (exit code $($proc.ExitCode))" }
          Stop-Process -Id $proc.Id -Force
      - name: Upload portable Windows ZIP
        if: \${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: matricx-cowork-windows
          path: matricx-cowork-windows.zip
          if-no-files-found: error
          retention-days: 14
